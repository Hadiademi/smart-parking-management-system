# PostgreSQL Profile Configuration
# To use this profile, run: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# or add to VM options: -Dspring.profiles.active=postgres

spring.application.name=smart-parking-system

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/smartparkingdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.example.demo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
